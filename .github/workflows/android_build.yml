name: Android Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (same as build_release_secure.bat)
    runs-on: ubuntu-latest
    env:
      # Clear proxy (do not use local 127.0.0.1:7890 on GitHub runners)
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      GRADLE_OPTS: ""

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify signing files in repo
        run: |
          test -f android/key.properties
          test -f android/app/ci-debug.keystore
          grep -q 'ci-debug.keystore' android/key.properties

      - name: Build Release APK (obfuscated)
        run: |
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/symbols

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: android-symbols
          path: build/symbols/
          if-no-files-found: warn
